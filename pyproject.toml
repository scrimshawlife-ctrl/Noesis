[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "noesis-latent"
version = "0.1.0"
description = "Evidence-first latent representation research runtime for Abraxas"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0,<3",
  "jsonschema>=4.23,<5"
]

[project.optional-dependencies]
hf = [
  "transformers>=4.56,<5",
  "torch>=2.4,<3",
  "safetensors>=0.4"
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7"
]

[tool.hatch.build.targets.wheel]
packages = ["src/noesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["noesis"]
