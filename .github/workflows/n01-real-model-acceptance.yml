name: n01-real-model-acceptance

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Open-weight Hugging Face model ID"
        required: true
        default: "sshleifer/tiny-distilbert-base-cased"
        type: string
      revision:
        description: "Immutable model revision/commit SHA"
        required: true
        default: "657df2b83a6986d88e4f528740259c9b49f796b1"
        type: string
      fixture_text:
        description: "Public reproducible acceptance fixture text"
        required: true
        default: "The quick brown fox jumps over the lazy dog."
        type: string
      hidden_layer_1:
        description: "First hidden-state layer index"
        required: true
        default: "1"
        type: string
      hidden_layer_2:
        description: "Second hidden-state layer index"
        required: true
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NOESIS_MODEL_ID: ${{ inputs.model_id }}
      NOESIS_REVISION: ${{ inputs.revision }}
      NOESIS_FIXTURE_TEXT: ${{ inputs.fixture_text }}
      NOESIS_LAYER_1: ${{ inputs.hidden_layer_1 }}
      NOESIS_LAYER_2: ${{ inputs.hidden_layer_2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Noesis Hugging Face runtime
        run: python -m pip install -e '.[hf]'
      - name: Run pinned-model acceptance
        run: |
          python scripts/run_n01_acceptance.py \
            --model-id "$NOESIS_MODEL_ID" \
            --revision "$NOESIS_REVISION" \
            --fixture-id "n01-manual-fixture" \
            --text "$NOESIS_FIXTURE_TEXT" \
            --site embedding \
            --site "hidden_state:$NOESIS_LAYER_1" \
            --site "hidden_state:$NOESIS_LAYER_2" \
            --repeats 2 \
            --artifacts out/acceptance/artifacts \
            --output out/acceptance/n01-evidence.json
      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: n01-acceptance-evidence
          path: out/acceptance
          if-no-files-found: error
