name: spec-validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'spec/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository specification
        run: python scripts/validate_specs.py
